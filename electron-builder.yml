appId: dev.ericfisher.genfolio
productName: Genfolio
copyright: Copyright © 2026 Eric Fisher
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest,playwright}.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.nvmrc,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/node_modules/better-sqlite3/**/*'
  - '**/node_modules/@napi-rs/**/*'
linux:
  target:
    - AppImage
    - pacman
    - deb
  executableName: genfolio
  icon: build/icons/
  category: Graphics;Viewer
  syncDesktopName: true
  desktop:
    entry:
      Keywords: gallery;images;stable diffusion;fooocus;a1111;
  maintainer: Eric Fisher <eric@ericfisher.dev>
  synopsis: Gallery for AI-generated images
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
pacman:
  artifactName: ${name}-${version}-${arch}.${ext}
  # electron-builder's default pacman depends include http-parser, which Arch no longer ships.
  # This list is the Arch packages providing the libraries the Electron binary links directly
  # (readelf NEEDED), plus xdg-utils for opening folders/files.
  depends:
    - alsa-lib
    - at-spi2-core
    - cairo
    - dbus
    - expat
    - glib2
    - gtk3
    - libcups
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa
    - nspr
    - nss
    - pango
    - systemd-libs
    - xdg-utils
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
npmRebuild: false
# The update feed: electron-updater reads GitHub Releases for `latest-linux.yml`. Setting it also
# makes electron-builder write `app-update.yml` and `package-type` into the packages. Nothing is
# uploaded from a build; the release workflow uploads the artifacts.
publish:
  provider: github
  owner: ericfisherdev
  repo: genfolio
  releaseType: release
