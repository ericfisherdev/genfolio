appId: dev.ericfisher.genfolio
productName: Genfolio
copyright: Copyright © 2026 Eric Fisher
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest,playwright}.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.nvmrc,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/node_modules/better-sqlite3/**/*'
  - '**/node_modules/@napi-rs/**/*'
linux:
  target:
    - AppImage
    - pacman
    - deb
  executableName: genfolio
  syncDesktopName: true
  maintainer: Eric Fisher <eric@ericfisher.dev>
  category: Graphics
  synopsis: Gallery for AI-generated images
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
pacman:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
npmRebuild: false
publish: null
