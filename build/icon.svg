<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Genfolio logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#136A6F"/>
      <stop offset="1" stop-color="#0B3F4A"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#F59E6B"/>
    </linearGradient>
    <clipPath id="photo">
      <rect x="164" y="168" width="184" height="150" rx="12"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04262D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Back frames (the portfolio stack) -->
  <g filter="url(#shadow)">
    <rect x="148" y="150" width="216" height="232" rx="22" fill="#E8577E" transform="rotate(-15 256 266)"/>
    <rect x="148" y="150" width="216" height="232" rx="22" fill="#F4B63F" transform="rotate(8 256 266)"/>

    <!-- Front frame -->
    <rect x="148" y="152" width="216" height="232" rx="22" fill="#FAFAF7"/>
  </g>

  <!-- Photo inside front frame -->
  <g clip-path="url(#photo)">
    <rect x="164" y="168" width="184" height="150" fill="url(#sky)"/>
    <circle cx="298" cy="220" r="22" fill="#FFF4D6"/>
    <path d="M150 330 L222 244 L262 290 L292 262 L360 330 Z" fill="#136A6F"/>
    <path d="M150 330 L200 286 L238 318 L270 296 L312 330 Z" fill="#0B3F4A"/>
  </g>

  <!-- Caption strip -->
  <rect x="172" y="340" width="96" height="12" rx="6" fill="#D9DEDC"/>
  <rect x="172" y="360" width="60" height="10" rx="5" fill="#E7EAE8"/>

  <!-- Generative sparkle -->
  <path d="M390 92 C394 122 404 132 434 136 C404 140 394 150 390 180 C386 150 376 140 346 136 C376 132 386 122 390 92 Z" fill="#FFD98A"/>
  <path d="M430 186 C432 198 436 202 448 204 C436 206 432 210 430 222 C428 210 424 206 412 204 C424 202 428 198 430 186 Z" fill="#FAFAF7" opacity="0.85"/>
</svg>
